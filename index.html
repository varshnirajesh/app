<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A sleek, modern calculator app with glassmorphism design and smooth animations." />
  <title>Calculator — Sleek &amp; Modern</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="calculator-wrapper" role="main">
    <h1 class="sr-only">Calculator</h1>
    <div class="calculator" id="calculator" aria-label="Calculator">

      <!-- Display -->
      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="expression" id="expression" aria-label="Expression"></div>
        <div class="result" id="result" aria-label="Result">0</div>
      </div>

      <!-- History strip -->
      <div class="history-strip" id="history-strip">
        <span class="history-label">History</span>
        <ul class="history-list" id="history-list" aria-label="Calculation history"></ul>
      </div>

      <!-- Buttons -->
      <div class="buttons" id="buttons">

        <!-- Row 1 -->
        <button class="btn btn-func span-2" id="btn-ac"    data-action="clear"   aria-label="All Clear">AC</button>
        <button class="btn btn-func"         id="btn-sign"  data-action="sign"    aria-label="Toggle sign">+/−</button>
        <button class="btn btn-func"         id="btn-pct"   data-action="percent" aria-label="Percent">%</button>
        <button class="btn btn-op"           id="btn-div"   data-action="op" data-op="÷" aria-label="Divide">÷</button>

        <!-- Row 2 -->
        <button class="btn btn-num" id="btn-7" data-action="digit" data-digit="7" aria-label="7">7</button>
        <button class="btn btn-num" id="btn-8" data-action="digit" data-digit="8" aria-label="8">8</button>
        <button class="btn btn-num" id="btn-9" data-action="digit" data-digit="9" aria-label="9">9</button>
        <button class="btn btn-op"  id="btn-mul" data-action="op" data-op="×" aria-label="Multiply">×</button>

        <!-- Row 3 -->
        <button class="btn btn-num" id="btn-4" data-action="digit" data-digit="4" aria-label="4">4</button>
        <button class="btn btn-num" id="btn-5" data-action="digit" data-digit="5" aria-label="5">5</button>
        <button class="btn btn-num" id="btn-6" data-action="digit" data-digit="6" aria-label="6">6</button>
        <button class="btn btn-op"  id="btn-sub" data-action="op" data-op="−" aria-label="Subtract">−</button>

        <!-- Row 4 -->
        <button class="btn btn-num" id="btn-1" data-action="digit" data-digit="1" aria-label="1">1</button>
        <button class="btn btn-num" id="btn-2" data-action="digit" data-digit="2" aria-label="2">2</button>
        <button class="btn btn-num" id="btn-3" data-action="digit" data-digit="3" aria-label="3">3</button>
        <button class="btn btn-op"  id="btn-add" data-action="op" data-op="+" aria-label="Add">+</button>

        <!-- Row 5 -->
        <button class="btn btn-num span-2" id="btn-0"     data-action="digit" data-digit="0"   aria-label="0">0</button>
        <button class="btn btn-num"        id="btn-dot"   data-action="dot"                     aria-label="Decimal point">.</button>
        <button class="btn btn-eq"         id="btn-eq"    data-action="equals"                  aria-label="Equals">=</button>

      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
